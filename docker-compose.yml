services:
  postgres:
    image: postgres:16-alpine
    container_name: audit_bench_postgres
    environment:
      POSTGRES_USER: audit_bench
      POSTGRES_PASSWORD: audit_bench_secure_pwd
      POSTGRES_DB: audit_bench
    ports:
      - "5432:5432"
    volumes:
      - audit_bench_pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_bench"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: audit_bench_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: audit_bench_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://audit_bench:audit_bench_secure_pwd@postgres:5432/audit_bench
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: audit_bench_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  audit_bench_pg_data:
